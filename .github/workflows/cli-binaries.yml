name: CLI binaries

on:
  workflow_call:
    inputs:
      release_tag:
        description: Optional exact v-prefixed tag for release builds
        required: false
        type: string
        default: ""
      attest:
        description: Create and retain provenance and SBOM attestations
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  plan:
    name: Validate CLI target policy
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Export the checked target matrix
        id: targets
        run: python scripts/build_cli_release.py matrix --github-output "$GITHUB_OUTPUT"

  build:
    name: CLI binary (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build the locked release executable
        shell: bash
        run: cargo build --locked --release --package pdfplumber-cli --target "${{ matrix.target }}"

      - name: Verify and package the native executable
        shell: bash
        run: >-
          python scripts/build_cli_release.py package
          --target "${{ matrix.target }}"
          --runner-os "${{ runner.os }}"
          --runner-arch "${{ runner.arch }}"
          --release-tag "${{ inputs.release_tag }}"
          --output-dir dist/subjects

      - name: Smoke-test the extracted archive against the exact fixture
        shell: bash
        run: >-
          python scripts/build_cli_release.py smoke
          --target "${{ matrix.target }}"
          --release-tag "${{ inputs.release_tag }}"
          --archive-dir "dist/subjects"

      - name: Prepare the CLI integrity directory
        shell: bash
        run: mkdir -p dist/integrity

      - name: Generate the CLI archive SPDX document
        uses: anchore/sbom-action@v0
        with:
          path: dist/subjects
          format: spdx-json
          output-file: dist/integrity/cli-${{ matrix.target }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Bind the CLI archive to its exact subject and SBOM
        shell: bash
        run: >-
          python scripts/build_release_integrity.py group
          --group-id cli-${{ matrix.target }}
          --family cli-binary
          --subjects-dir dist/subjects
          --subject-glob 'pdfplumber-cli-*'
          --sbom dist/integrity/cli-${{ matrix.target }}.spdx.json
          --source-commit "$GITHUB_SHA"
          --release-tag "${{ inputs.release_tag }}"
          --output dist/integrity/cli-${{ matrix.target }}.group.json

      - name: Attest CLI archive build provenance
        if: inputs.attest
        id: provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/subjects/pdfplumber-cli-*

      - name: Retain the CLI archive provenance bundle
        if: inputs.attest
        shell: bash
        run: cp "${{ steps.provenance.outputs.bundle-path }}" dist/integrity/cli-${{ matrix.target }}.provenance.sigstore.json

      - name: Attest the CLI archive SBOM
        if: inputs.attest
        id: sbom-attestation
        uses: actions/attest@v4
        with:
          subject-path: dist/subjects/pdfplumber-cli-*
          sbom-path: dist/integrity/cli-${{ matrix.target }}.spdx.json

      - name: Retain the CLI archive SBOM attestation bundle
        if: inputs.attest
        shell: bash
        run: cp "${{ steps.sbom-attestation.outputs.bundle-path }}" dist/integrity/cli-${{ matrix.target }}.sbom.sigstore.json

      - name: Retain the verified release archive
        uses: actions/upload-artifact@v4
        with:
          name: cli-binary-${{ matrix.target }}
          path: |
            dist/subjects/*
            dist/integrity/*
          if-no-files-found: error
          compression-level: 0

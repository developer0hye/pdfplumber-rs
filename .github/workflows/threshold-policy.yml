name: Compatibility threshold policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    branches: [main]
    types: [submitted, dismissed, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  threshold-policy:
    name: Threshold reductions require evidence and maintainer approval
    runs-on: ubuntu-latest
    steps:
      # pull_request_target is deliberate: execute only the trusted base policy,
      # never Python or workflow code checked out from the untrusted PR head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch the pull request head as data only
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          git fetch --no-tags origin
          "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/threshold-policy-head"

      - name: Enforce compatibility percentage-threshold policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          python scripts/check_threshold_policy.py
          --base "${BASE_SHA}"
          --head refs/remotes/origin/threshold-policy-head
          --head-sha "${HEAD_SHA}"
          --repository "${REPOSITORY}"
          --pull-request "${PR_NUMBER}"

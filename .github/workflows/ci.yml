name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude pdfplumber-py --exclude pdfplumber-wasm -- -D warnings
      - name: Lint all-feature public API documentation contracts
        run: cargo clippy -p pdfplumber --all-features --no-deps -- -D warnings -D clippy::missing_errors_doc -D clippy::missing_panics_doc

  test:
    name: Test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --exclude pdfplumber-py --exclude pdfplumber-wasm
      - run: cargo test --workspace --exclude pdfplumber-py --exclude pdfplumber-wasm

      - name: Test additive Rust feature combinations and extraction semantics
        run: |
          cargo test -p pdfplumber --test feature_semantics --no-default-features
          cargo test -p pdfplumber --test feature_semantics
          cargo test -p pdfplumber --test feature_semantics --no-default-features --features serde
          cargo test -p pdfplumber --test feature_semantics --no-default-features --features parallel
          cargo test -p pdfplumber --test feature_semantics --all-features
          cargo test -p pdfplumber-core --features serde --test serde_roundtrip
          cargo test -p pdfplumber-parse --features tracing

      - name: Test Rust concurrency with optional parallel processing
        run: cargo test -p pdfplumber --features parallel --test concurrency

      - name: Compile task-oriented Rust examples
        run: cargo check -p pdfplumber --examples --all-features

      - name: Test compile-fail Rust API documentation
        run: cargo test -p pdfplumber --doc --all-features

      - name: Build strict all-feature public Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p pdfplumber --no-deps --all-features

      - name: Build and verify Rust crate artifacts
        run: |
          python scripts/check_crates_release.py --expected-commit "$GITHUB_SHA" --package-only
          python scripts/check_package_licenses.py --rust target/package/*.crate
          python scripts/check_package_metadata.py --rust target/package/*.crate

      - name: Test rendered Rust and CLI quick starts
        run: python scripts/check_doc_quickstarts.py --rust --cli

  rust-dev-container:
    name: Rust development container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the reproducible Rust contributor paths
        run: scripts/check_rust_dev_container.sh

  python-native-layout:
    name: Python native package layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheel and source distribution
        run: |
          python -m pip install 'maturin==1.14.1'
          maturin build --manifest-path crates/pdfplumber-py/Cargo.toml --interpreter python --out dist
          maturin sdist --manifest-path crates/pdfplumber-py/Cargo.toml --out dist

      - name: Verify Python package artifacts
        run: |
          python scripts/check_package_licenses.py --python dist/*.whl dist/*.tar.gz
          python scripts/check_package_metadata.py --python dist/*.whl dist/*.tar.gz

      - name: Build and verify isolated candidate environment
        run: python scripts/setup_candidate_venv.py --python python --wheel dist/*.whl

      - name: Test installed wheel layout
        run: |
          python -m venv .venv-native-wheel
          .venv-native-wheel/bin/python -m pip install --no-deps dist/*.whl
          .venv-native-wheel/bin/python -m unittest discover -s crates/pdfplumber-py/tests -p 'test_native_layout.py' -v

      - name: Test rendered Python quick start
        run: python scripts/check_doc_quickstarts.py --python --wheel dist/*.whl

      - name: Test installed source distribution layout
        run: |
          python -m venv .venv-native-sdist
          . .venv-native-sdist/bin/activate
          python -m pip install 'maturin==1.14.1'
          python -m pip install --no-build-isolation --no-deps dist/*.tar.gz
          python -m unittest discover -s crates/pdfplumber-py/tests -p 'test_native_layout.py' -v

  compat-harness:
    name: Compatibility harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned reference interpreter
        id: pinned
        run: |
          version=$(python3 -c "
          import tomllib
          with open('compat/upstream.toml', 'rb') as handle:
              print(tomllib.load(handle)['environment']['python_version'])
          ")
          echo "python-version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pinned.outputs.python-version }}

      # Structural gates on the lock file and provenance. These need no network,
      # so a broken harness fails in seconds instead of after a full install.
      - name: Test the harness
        run: python -m unittest discover -s compat/tests -t . -v

      - name: Validate rendered documentation quick starts
        run: python scripts/check_doc_quickstarts.py --check

      - name: Validate the versioned Rust time-to-first-value result
        run: python scripts/measure_rust_ttfv.py --check docs/measurements/rust-ttfv-workspace-2026-08-28.json

      - name: Validate the PRD checklist and evidence contract
        run: python scripts/check_prd.py

      - name: Validate the generated support matrix
        run: python scripts/generate_support_matrix.py --check

      - name: Validate the versioned readiness page
        run: python scripts/generate_readiness.py --check

      - name: Validate the dated adoption baseline
        run: python scripts/generate_adoption_baseline.py --check

      - name: Validate the versioned release notes
        run: python scripts/generate_release_notes.py --check

      - name: Validate the source package license policy
        run: python scripts/check_package_licenses.py --source

      - name: Validate the source package metadata
        run: python scripts/check_package_metadata.py --source

      - name: Validate PDF fixture provenance and licenses
        run: python scripts/check_fixture_licenses.py

      - name: Validate the unified compatibility corpus index
        run: python scripts/check_corpus_index.py

      - name: Validate the versioned benchmark corpus
        run: python scripts/generate_benchmark_corpus.py --check

      - name: Validate benchmark output equivalence policy
        run: python scripts/check_benchmark_equivalence.py --check

      - name: Validate the pinned competitor benchmark suite
        run: python scripts/run_competitor_benchmarks.py --check

      - name: Validate separated benchmark stages
        run: python scripts/run_stage_benchmarks.py --check

      - name: Validate benchmark resource and artifact metrics
        run: python scripts/run_benchmark_metrics.py --check

      - name: Validate benchmark workload scenarios
        run: python scripts/run_benchmark_scenarios.py --check
      - name: Validate benchmark run provenance
        run: python scripts/run_benchmark_provenance.py --check

      - name: Validate benchmark result publication
        run: python scripts/publish_benchmark_results.py --check

      - name: Validate benchmark result retention
        run: python scripts/audit_benchmark_results.py --check

      - name: Validate benchmark regression alerts
        run: python scripts/check_benchmark_regressions.py --check

      - name: Validate release-candidate scorecard history
        run: python scripts/build_release_candidate_scorecards.py --check

      - name: Validate the versioned compatibility scorecard
        run: python scripts/generate_compatibility_scorecard.py --check

      - name: Validate the human compatibility workflow report
        run: python scripts/generate_workflow_scorecard.py --check

      - name: Verify the pinned upstream PDF fixture corpus
        run: python scripts/import_upstream_fixtures.py --check

      - name: Validate the approved-delta registry
        run: python scripts/check_approved_deltas.py

      # Proves the lock file is installable and hash-complete, which is the
      # claim every later compatibility gate rests on.
      - name: Build the pinned reference environment
        run: bash scripts/setup_golden_venv.sh
        env:
          # Fail rather than warn if the runner's interpreter drifts from the pin.
          PDFPLUMBER_RS_REQUIRE_PINNED_PYTHON: "1"

      - name: Confirm the reference environment is the pinned upstream release
        run: .venv-reference/bin/python scripts/verify_compat_env.py --reference --expect-root "$PWD/.venv-reference"

      - name: Test all-page fixture reporting against pinned upstream
        run: >-
          .venv-reference/bin/python -m unittest
          compat.tests.parity_report_pages_test
          compat.tests.ordered_sequence_test
          compat.tests.dictionary_structure_test -v

      - name: Verify the pinned upstream public API snapshot
        run: .venv-reference/bin/python scripts/generate_api_snapshot.py --check

      - name: Verify the pinned upstream object-schema snapshot
        run: .venv-reference/bin/python scripts/generate_object_schema_snapshot.py --check

      - name: Verify the pinned upstream text/table option matrix
        run: .venv-reference/bin/python scripts/generate_option_matrix.py --check

      - name: Verify exceptional and resource behavior against pinned upstream
        run: .venv-reference/bin/python compat/error_contract.py --reference

      - name: Verify exact JSON and CSV behavior against pinned upstream
        run: .venv-reference/bin/python compat/serialization_contract.py --reference

      - name: Verify the pinned upstream call contracts
        run: .venv-reference/bin/python compat/api_contract.py

  wasm-package-license:
    name: WASM package license
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Build WASM bundler package
        run: wasm-pack build --target bundler --out-dir pkg crates/pdfplumber-wasm

      - name: Build WASM Node package
        run: wasm-pack build --target nodejs --out-dir pkg-node crates/pdfplumber-wasm

      - name: Verify npm package artifact
        run: |
          python scripts/check_package_licenses.py --npm crates/pdfplumber-wasm/pkg
          python scripts/check_package_metadata.py --npm crates/pdfplumber-wasm/pkg

      - name: Test rendered Node/WebAssembly quick start
        run: python scripts/check_doc_quickstarts.py --wasm-node --npm-package crates/pdfplumber-wasm/pkg-node

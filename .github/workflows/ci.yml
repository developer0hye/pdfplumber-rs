name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude pdfplumber-py --exclude pdfplumber-wasm -- -D warnings

  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}
      - run: cargo check --workspace --exclude pdfplumber-py --exclude pdfplumber-wasm
      - run: cargo test --workspace --exclude pdfplumber-py --exclude pdfplumber-wasm

  compat-harness:
    name: Compatibility harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned reference interpreter
        id: pinned
        run: |
          version=$(python3 -c "
          import tomllib
          with open('compat/upstream.toml', 'rb') as handle:
              print(tomllib.load(handle)['environment']['python_version'])
          ")
          echo "python-version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pinned.outputs.python-version }}

      # Structural gates on the lock file and provenance. These need no network,
      # so a broken harness fails in seconds instead of after a full install.
      - name: Test the harness
        run: python -m unittest discover -s compat/tests -t . -v

      # Proves the lock file is installable and hash-complete, which is the
      # claim every later compatibility gate rests on.
      - name: Build the pinned reference environment
        run: bash scripts/setup_golden_venv.sh
        env:
          # Fail rather than warn if the runner's interpreter drifts from the pin.
          PDFPLUMBER_RS_REQUIRE_PINNED_PYTHON: "1"

      - name: Confirm the reference environment is the pinned upstream release
        run: .venv-reference/bin/python scripts/verify_compat_env.py --reference --expect-root "$PWD/.venv-reference"

      - name: Test all-page fixture reporting against pinned upstream
        run: >-
          .venv-reference/bin/python -m unittest
          compat.tests.parity_report_pages_test
          compat.tests.ordered_sequence_test -v

      - name: Verify the pinned upstream public API snapshot
        run: .venv-reference/bin/python scripts/generate_api_snapshot.py --check

      - name: Verify the pinned upstream call contracts
        run: .venv-reference/bin/python compat/api_contract.py

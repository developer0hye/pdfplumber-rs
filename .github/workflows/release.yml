name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      release-notes: ${{ steps.metadata.outputs.release-notes }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Match the tag and release contract
        id: metadata
        run: python scripts/check_package_metadata.py --release-tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"

  scorecards:
    name: Verify release-candidate scorecards
    needs: [ci, metadata]
    uses: ./.github/workflows/release-candidate-scorecards.yml
    with:
      candidate_id: ${{ github.ref_name }}

  cli-binaries:
    name: Build prebuilt CLI binaries
    needs: [ci, metadata]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/cli-binaries.yml
    with:
      release_tag: ${{ github.ref_name }}
      attest: true

  release-artifacts:
    name: Build release archives, wheels, and source distribution
    needs: [ci, metadata, scorecards]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-artifacts.yml
    with:
      release_tag: ${{ github.ref_name }}
      attest: true

  integrity:
    name: Verify the complete release artifact inventory
    needs: [release-artifacts, cli-binaries, metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-rust-*
          path: release-bundle
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: release-python-*
          path: release-bundle
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-binary-*
          path: release-bundle
          merge-multiple: true

      - name: Build the required checksum and integrity index
        run: >-
          python scripts/build_release_integrity.py aggregate
          --bundle-dir release-bundle
          --output-dir release-integrity
          --source-commit "$GITHUB_SHA"
          --release-tag "$GITHUB_REF_NAME"
          --attestations required

      - name: Retain the complete checksum and integrity index
        uses: actions/upload-artifact@v4
        with:
          name: release-integrity
          path: release-integrity/*
          if-no-files-found: error
          compression-level: 0

  # ── crates.io ──────────────────────────────────────────────

  publish:
    name: Publish to crates.io
    needs: [release-artifacts, metadata, scorecards, integrity]
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/pdfplumber
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Exchange the workflow identity for a short-lived crates.io token
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish pdfplumber-core
        run: cargo publish -p pdfplumber-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      - name: Verify pdfplumber-core is resolvable from crates.io
        run: python scripts/wait_for_crate_resolution.py pdfplumber-core --release-tag "$GITHUB_REF_NAME" --timeout-seconds 300

      - name: Publish pdfplumber-parse
        run: cargo publish -p pdfplumber-parse
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      - name: Verify pdfplumber-parse is resolvable from crates.io
        run: python scripts/wait_for_crate_resolution.py pdfplumber-parse --release-tag "$GITHUB_REF_NAME" --timeout-seconds 300

      - name: Publish pdfplumber
        run: cargo publish -p pdfplumber
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      - name: Verify pdfplumber is resolvable from crates.io
        run: python scripts/wait_for_crate_resolution.py pdfplumber --release-tag "$GITHUB_REF_NAME" --timeout-seconds 300

      - name: Publish pdfplumber-cli
        run: cargo publish -p pdfplumber-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  # ── PyPI (maturin wheels + sdist) ──────────────────────────

  publish-pypi:
    name: Publish to PyPI
    needs: [release-artifacts, scorecards, integrity]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pdfplumber-rs/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-python-*
          merge-multiple: true
          path: release-python

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-python/subjects

  release:
    name: GitHub Release
    needs:
      [
        publish,
        publish-pypi,
        metadata,
        scorecards,
        cli-binaries,
        release-artifacts,
        integrity,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-candidate-scorecards-*
          path: release-scorecards
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: release-rust-*
          path: release-packages
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: release-python-*
          path: release-packages
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-binary-*
          path: release-cli-binaries
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-integrity
          path: release-integrity
      - uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ needs.metadata.outputs.release-notes }}
          prerelease: ${{ needs.metadata.outputs.prerelease }}
          generate_release_notes: true
          files: |
            release-scorecards/*
            release-packages/subjects/*
            release-packages/integrity/*
            release-cli-binaries/subjects/*
            release-cli-binaries/integrity/*
            release-integrity/**
          fail_on_unmatched_files: true

  # ── npm (wasm-pack) ────────────────────────────────────────

  publish-npm:
    name: Publish to npm
    needs: [ci, metadata, scorecards]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/pdfplumber-wasm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          registry-url: https://registry.npmjs.org

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0

      - name: Build WASM package
        run: wasm-pack build --target bundler --out-dir pkg crates/pdfplumber-wasm

      - name: Copy hand-authored type definitions
        run: cp crates/pdfplumber-wasm/pdfplumber-wasm.d.ts crates/pdfplumber-wasm/pkg/pdfplumber_wasm.d.ts

      - name: Publish to npm
        run: npm publish crates/pdfplumber-wasm/pkg --access public

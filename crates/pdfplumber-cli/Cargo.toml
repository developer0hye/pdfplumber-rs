[package]
name = "pdfplumber-cli"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Alpha CLI for evidence-driven PDF extraction: text, geometry, images, and tables"
keywords = ["pdf", "cli", "table", "text-extraction"]
categories = ["command-line-utilities"]

[package.metadata.pdfplumber-rs]
maturity = "alpha"

[[bin]]
name = "pdfplumber"
path = "src/main.rs"

[dependencies]
pdfplumber = { version = "0.3.0", path = "../pdfplumber", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
lopdf = "0.36"
tempfile = "3"
serde_json = "1.0"

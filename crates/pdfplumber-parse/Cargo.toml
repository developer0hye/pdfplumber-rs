[package]
name = "pdfplumber-parse"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Alpha parser and content-stream interpreter for evidence-driven PDF extraction"
keywords = ["pdf", "parser", "content-stream", "pdfplumber"]
categories = ["parser-implementations"]

[package.metadata.pdfplumber-rs]
maturity = "alpha"

[features]
tracing = ["dep:tracing"]

[dependencies]
pdfplumber-core = { version = "0.4.1", path = "../pdfplumber-core" }
lopdf = { version = "0.44", default-features = false }
thiserror = "2"
encoding_rs = "0.8"
tracing = { version = "0.1", optional = true }

[dev-dependencies]
md5 = "0.7"

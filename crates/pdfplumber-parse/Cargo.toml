[package]
name = "pdfplumber-parse"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Alpha parser and content-stream interpreter for evidence-driven PDF extraction"
keywords = ["pdf", "parser", "content-stream", "pdfplumber"]
categories = ["parser-implementations"]

[package.metadata.pdfplumber-rs]
maturity = "alpha"

[features]
tracing = ["dep:tracing"]

[dependencies]
pdfplumber-core = { version = "0.3.0", path = "../pdfplumber-core" }
lopdf = { version = "0.39", default-features = false }
lopdf_pre_nom_locate = { package = "lopdf", version = "0.34", default-features = false, features = ["nom_parser"] }
thiserror = "2"
encoding_rs = "0.8"
tracing = { version = "0.1", optional = true }

[dev-dependencies]
md5 = "0.7"

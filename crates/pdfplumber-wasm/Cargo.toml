[package]
name = "pdfplumber-wasm"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Experimental WebAssembly/JavaScript bindings for pdfplumber-rs PDF extraction"
keywords = ["pdf", "wasm", "webassembly", "pdfplumber", "table-extraction"]
categories = ["wasm", "parser-implementations"]
publish = false

[package.metadata.pdfplumber-rs]
maturity = "experimental"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
pdfplumber = { path = "../pdfplumber", default-features = false, features = ["serde"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }

[dev-dependencies]
lopdf = "0.34"
wasm-bindgen-test = "0.3"

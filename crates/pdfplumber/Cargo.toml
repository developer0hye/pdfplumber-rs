[package]
name = "pdfplumber"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Alpha evidence-driven PDF extraction for Rust: text, geometry, images, and tables"
keywords = ["pdf", "table", "text-extraction", "pdfplumber", "document"]
categories = ["parser-implementations", "text-processing"]

# The fixture corpus is ~160 MB of golden JSON and sample PDFs used only by the
# repository test suite. Shipping it would exceed the crates.io size limit and
# force every downstream user to download it.
exclude = ["tests/fixtures/"]

[package.metadata.pdfplumber-rs]
maturity = "alpha"

[features]
default = ["std"]
std = []
serde = ["pdfplumber-core/serde"]
parallel = ["dep:rayon"]

[dependencies]
pdfplumber-core = { version = "0.3.0", path = "../pdfplumber-core" }
pdfplumber-parse = { version = "0.3.0", path = "../pdfplumber-parse" }
rayon = { version = "1.10", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
lopdf = "0.34"
md5 = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[example]]
name = "serialize_words"
required-features = ["serde"]

[[example]]
name = "parallel_batch"
required-features = ["parallel"]

[[bench]]
name = "extraction"
harness = false

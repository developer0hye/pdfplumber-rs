[package]
name = "pdfplumber-py"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Alpha Python migration path for pdfplumber workflows, powered by evidence-driven PDF extraction in Rust"
publish = false

[package.metadata.pdfplumber-rs]
maturity = "alpha"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
pyo3 = { version = "0.24" }
pdfplumber = { path = "../pdfplumber" }

[features]
extension-module = ["pyo3/extension-module"]

[dev-dependencies]
lopdf = "0.34"
pyo3 = { version = "0.24", features = ["auto-initialize"] }

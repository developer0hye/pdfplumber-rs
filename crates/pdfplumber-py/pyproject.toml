[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pdfplumber-rs"
description = "Alpha Python migration path for pdfplumber workflows, powered by evidence-driven PDF extraction in Rust"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["pdf", "table", "text-extraction", "pdfplumber", "document", "parsing"]
authors = [
    { name = "pdfplumber-rs contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dynamic = ["version"]
readme = "README.md"

[project.urls]
Homepage = "https://github.com/developer0hye/pdfplumber-rs"
Repository = "https://github.com/developer0hye/pdfplumber-rs"
Issues = "https://github.com/developer0hye/pdfplumber-rs/issues"

[tool.maturin]
features = ["extension-module"]
python-source = "python"
module-name = "pdfplumber._native"

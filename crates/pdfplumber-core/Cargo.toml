[package]
name = "pdfplumber-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Alpha core types and algorithms for evidence-driven PDF extraction"
keywords = ["pdf", "table", "text-extraction", "pdfplumber"]
categories = ["parser-implementations", "text-processing"]

[package.metadata.pdfplumber-rs]
maturity = "alpha"

[features]
serde = ["dep:serde"]

[dependencies]
regex = "1"
serde = { version = "1.0", features = ["derive"], optional = true }
unicode-bidi = "0.3"
unicode-normalization = "0.1"

[dev-dependencies]
serde_json = "1.0"

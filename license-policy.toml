schema_version = 1
spdx_expression = "Apache-2.0"
license_file = "LICENSE"
license_sha256 = "b1170ffab5ff33cd411746a6de04917574890bff1d3df9ef3f348d27b78bce72"
repository = "https://github.com/developer0hye/pdfplumber-rs"
source_version = "0.4.0"
current_since = "0.3.0"
historical_dual_license_through = "0.2.0"

workspace_manifests = [
    "crates/pdfplumber-core/Cargo.toml",
    "crates/pdfplumber-parse/Cargo.toml",
    "crates/pdfplumber/Cargo.toml",
    "crates/pdfplumber-cli/Cargo.toml",
    "crates/pdfplumber-py/Cargo.toml",
    "crates/pdfplumber-wasm/Cargo.toml",
]
package_license_files = [
    "crates/pdfplumber-core/LICENSE",
    "crates/pdfplumber-parse/LICENSE",
    "crates/pdfplumber/LICENSE",
    "crates/pdfplumber-cli/LICENSE",
    "crates/pdfplumber-py/LICENSE",
    "crates/pdfplumber-wasm/LICENSE",
]
public_readmes = [
    "crates/pdfplumber-cli/README.md",
    "crates/pdfplumber-py/README.md",
    "crates/pdfplumber-wasm/README.md",
]
rust_packages = [
    "pdfplumber-core",
    "pdfplumber-parse",
    "pdfplumber",
    "pdfplumber-cli",
]

[python]
distribution = "pdfplumber-rs"
manifest = "crates/pdfplumber-py/pyproject.toml"
license_file = "crates/pdfplumber-py/LICENSE"

[npm]
package = "pdfplumber-wasm"
manifest = "crates/pdfplumber-wasm/Cargo.toml"
license_file = "crates/pdfplumber-wasm/LICENSE"
